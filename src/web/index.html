<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshBox — заказы</title>
<style>
  :root { color-scheme: light; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #1b1d21; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; margin: 0 0 24px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #6b7280; margin: 10px 0 4px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; box-sizing: border-box; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 160px; }
  button { margin-top: 14px; padding: 9px 16px; border: 0; border-radius: 6px; background: #16794a; color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: #fff; color: #1b1d21; border: 1px solid #d1d5db; }
  #status { margin-top: 12px; font-size: 14px; min-height: 20px; }
  .ok { color: #16794a; }
  .err { color: #b42318; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f3; }
  th { color: #6b7280; font-weight: 500; }
  td.id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #4b5563; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FreshBox</h1>
  <p class="sub">Приём заказов</p>

  <div class="card">
    <form id="form">
      <div class="row">
        <div>
          <label for="customer">Клиент</label>
          <input id="customer" value="cust-10423" required>
        </div>
        <div>
          <label for="amount">Сумма, ₽</label>
          <input id="amount" type="number" step="0.01" value="2450.00" required>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="sku">Товар</label>
          <input id="sku" value="MILK-1L" required>
        </div>
        <div>
          <label for="qty">Количество</label>
          <input id="qty" type="number" min="1" value="2" required>
        </div>
      </div>
      <button type="submit">Оформить заказ</button>
      <div id="status"></div>
    </form>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between; align-items: center;">
      <strong>Последние заказы</strong>
      <button class="ghost" id="refresh" type="button">Обновить</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Заказ</th><th>Клиент</th><th>Сумма</th><th>Принят</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4">загрузка…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function loadOrders() {
  const tbody = $("rows");
  try {
    const res = await fetch("/api/orders?limit=50");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const orders = await res.json();
    if (!orders.length) {
      tbody.innerHTML = '<tr><td colspan="4">заказов пока нет</td></tr>';
      return;
    }
    tbody.innerHTML = orders.map((o) => `
      <tr>
        <td class="id">${o.order_id}</td>
        <td>${o.customer_id}</td>
        <td>${o.amount.toFixed(2)} ₽</td>
        <td>${new Date(o.created_at).toLocaleTimeString("ru-RU")}</td>
      </tr>`).join("");
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="4" class="err">не удалось получить список: ${e.message}</td></tr>`;
  }
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const status = $("status");
  const order = {
    order_id: crypto.randomUUID(),
    customer_id: $("customer").value,
    amount: Number($("amount").value),
    items: [{ sku: $("sku").value, qty: Number($("qty").value) }],
  };
  status.textContent = "отправляем…";
  status.className = "";
  try {
    const res = await fetch("/api/orders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(order),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    status.textContent = "заказ принят: " + order.order_id;
    status.className = "ok";
    setTimeout(loadOrders, 700);
  } catch (e) {
    status.textContent = "не удалось оформить заказ: " + e.message;
    status.className = "err";
  }
});

$("refresh").addEventListener("click", loadOrders);
loadOrders();
setInterval(loadOrders, 10000);
</script>
</body>
</html>
